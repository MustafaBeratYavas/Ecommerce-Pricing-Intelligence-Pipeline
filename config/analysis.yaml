analysis:
  category_aliases:
    "Kulaklık": "Headset"
  price_tiers:
    entry_upper: 3000
    mid_upper: 8000
    labels:
      entry: "Entry-Level"
      mid: "Mid-Range"
      premium: "Premium"
    order:
      - "Entry-Level"
      - "Mid-Range"
      - "Premium"
  marketplace_top_n: 10
  outlier_detection:
    iqr_multiplier: 1.5
    sample_size_per_category: 120
    sample_random_state: 42
  seller_depth_tiers:
    - label: "1-3 Sellers"
      max_sellers: 3
      color: "danger"
    - label: "4-6 Sellers"
      max_sellers: 6
      color: "warning"
    - label: "7-9 Sellers"
      max_sellers: 9
      color: "blue"
    - label: "10-12 Sellers"
      max_sellers: 12
      color: "teal"
    - label: "13-15 Sellers"
      max_sellers: 15
      color: "purple"
    - label: "16-18 Sellers"
      max_sellers: 18
      color: "success"
    - label: "19+ Sellers"
      color: "amber"

charts:
  style:
    figure_size: [19.2, 10.8]
    large_figure_size: [19.2, 10.8]
    dpi: 100
    plot_rect: [0.14, 0.17, 0.72, 0.72]
    colorbar_rect: [0.88, 0.17, 0.018, 0.72]
    font_family:
      - "Segoe UI"
      - "Liberation Sans"
      - "DejaVu Sans"
      - "sans-serif"
    title_size: 20
    subtitle_size: 12
    label_size: 12
    tick_size: 10
    legend_size: 10
    axis_label_pad: 18
    tick_label_pad: 8
    colors:
      background: "#0B1020"
      panel: "#141A2E"
      grid: "#2A3250"
      text: "#F1F5F9"
      muted_text: "#94A3B8"
      border: "#334155"
      accent: "#38BDF8"
      success: "#22C55E"
      warning: "#F59E0B"
      danger: "#F43F5E"
      purple: "#8B5CF6"
      teal: "#14B8A6"
      blue: "#3B82F6"
      amber: "#FBBF24"
    marketplace_colors:
      - "#38BDF8"
      - "#8B5CF6"
      - "#22C55E"
      - "#F59E0B"
      - "#F43F5E"
      - "#14B8A6"
      - "#A78BFA"
      - "#FB7185"
      - "#60A5FA"
      - "#FACC15"
      - "#4ADE80"
      - "#E879F9"
    category_colors:
      Mouse: "#22C55E"
      Headset: "#8B5CF6"
    tier_colors:
      Entry-Level: "#38BDF8"
      Mid-Range: "#F59E0B"
      Premium: "#F43F5E"
